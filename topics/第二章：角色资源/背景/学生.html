<h2 class="line">学生 Student</h2>
<p><b>属性值提升：</b>智力、感知、魅力<br>
<b>起源专长：</b>熟习。<br>
<b>技能熟练：</b>调查与历史。<br>
<b>工具熟练：</b>选择一种乐器或赌具，或书法工具。<br>
<b>起始装备：</b>选择A或B。</p>
<ul>
<li>(A): 学生<A href="../../第四章：冒险准备/冒险用品.html#证件">证件</A>，帆布背包（装有<A href="../../第四章：冒险准备/冒险用品.html#笔记本">笔记本</A>，教科书），工具（同上所选），旅行服装（校服），8GP</li>
<li>(B): 5000 LMD（50gp）</li>
</ul>
<p>你的生活被课堂、书本和移动城邦的教育机构所占据。你学习理论知识、基础科学，或者源石技艺的原理。同学间的讨论、导师的指导，以及对未来的憧憬或迷茫构成了你的日常。这段经历教会了你如何快速吸收信息、分析问题，以及在图书馆或数据库中进行有效检索。你开始意识到，书本外的世界同样充满挑战。</p>
