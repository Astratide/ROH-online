<h2 class="line">白领 White-collar</h2>
<p><b>属性值提升：</b>智力、体质、魅力<br>
<b>起源专长：</b>熟习。<br>
<b>技能熟练：</b>洞悉与游说。<br>
<b>工具熟练：</b>文书伪造工具。<br>
<b>起始装备：</b>选择A或B。</p>
<ul>
<li>(A): <A href="../../第四章：冒险准备/冒险用品.html#公文包">公文包</a>（装有<A href="../../第四章：冒险准备/冒险用品.html#香烟">香烟</A>，文书伪造工具，<A href="../../第四章：冒险准备/冒险用品.html#笔记本">笔记本</a>），高档服装（西装），香水或<A href="../../第四章：冒险准备/冒险用品.html#提神剂">提神剂</a>，12GP</li>
<li>(B): 5000 LMD（50gp）</li>
</ul>
<p>你的日子在移动城邦的办公楼隔间或数据处理中心里度过。你处理文件、协调资源、参与会议，或是维护复杂的城邦管理系统。办公室政治、项目截止日期和重复性工作磨练了你的耐心、对细节的观察力，以及在条条框框内沟通协调的能力。日复一日的流程让你对规则和秩序异常敏感，也深知表面平静下可能暗藏的玄机。</p>
